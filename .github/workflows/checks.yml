name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The app reads Solana and Arweave only; there is no database or secret
      # to provision. The cluster and program address are public values.
      NEXT_PUBLIC_SOLANA_CLUSTER: devnet
      NEXT_PUBLIC_TIPMARK_PROGRAM_ID: 7ZNWrEBx3QnTamR8ZZKwbksKvHhby3bg3W3akiz183TT
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
          # rust-toolchain.toml asks for clippy, but the action pins the
          # toolchain explicitly and installs no components unless told to.
          components: clippy, rustfmt

      # Solana CLI provides cargo-build-sbf, which anchor build delegates to.
      # v3.1.10 is the version recommended for Anchor 1.0.x.
      - name: Cache Solana toolchain
        id: cache-solana
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-v3.1.10
      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Anchor CLI — download the prebuilt binary matching Anchor.toml.
      - name: Install Anchor CLI
        run: |
          curl -sSfL -o /usr/local/bin/anchor \
            https://github.com/otter-sec/anchor/releases/download/v1.0.1/anchor-1.0.1-x86_64-unknown-linux-gnu
          chmod +x /usr/local/bin/anchor

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Rust tests and clippy
        run: NO_DNA=1 cargo test --workspace && NO_DNA=1 cargo clippy --workspace --all-targets -- -D warnings
      - name: Generate protocol artifacts
        run: bun run protocol:build && bun run protocol:generate
      - name: Committed IDL and client are up to date
        run: git diff --exit-code -- idls clients
      - name: TypeScript and unit tests
        run: bun run typecheck && bun test
      - name: Application build
        run: bun run build
