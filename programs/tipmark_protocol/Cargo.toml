[package]
name = "tipmark_protocol"
version = "0.1.0"
description = "Wallet-owned profiles and direct zero-fee support for Tipmark"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "tipmark_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
